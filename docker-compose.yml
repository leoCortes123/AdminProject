services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devcycle
      POSTGRES_PASSWORD: devcycle
      POSTGRES_DB: devcycle
    ports:
      - '5432:5432'
    volumes:
      - devcycle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devcycle']
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: devcycle
      MINIO_ROOT_PASSWORD: devcycle123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - devcycle_minio:/data
    profiles: ['storage']

volumes:
  devcycle_pgdata:
  devcycle_minio:
